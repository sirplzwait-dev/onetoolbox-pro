<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found - OneToolBox</title>
<meta name="description" content="The requested page could not be found on OneToolBox.">
<link rel="icon" href="/assets/logo/fevicon.ico">
<link rel="stylesheet" href="/assets/css/reset.css">
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/layout.css">
<link rel="stylesheet" href="/assets/css/components.css">
<link rel="stylesheet" href="/assets/css/header.css">
<link rel="stylesheet" href="/assets/css/footer.css">
<link rel="stylesheet" href="/assets/css/responsive.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
.not-found{min-height:70vh;display:grid;place-items:center;padding:80px 20px;text-align:center}
.not-found-card{max-width:680px;width:100%;padding:48px 28px;border-radius:24px;background:var(--card-bg,#fff);box-shadow:0 15px 45px rgba(15,23,42,.10)}
.not-found-code{font-size:clamp(72px,14vw,150px);font-weight:900;line-height:1;margin:0}
.not-found h1{margin:16px 0 10px}
.not-found p{margin:0 auto 26px;max-width:520px;line-height:1.7}
.not-found-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
</style>
  <link rel="stylesheet" href="/assets/css/onetoolbox-common-layout.css">
</head>
<body>
<div id="header-placeholder"></div>
<main class="not-found">
<section class="not-found-card">
<div class="not-found-code">404</div>
<h1>Page Not Found</h1>
<p>The page you are looking for may have been moved, renamed, or removed.</p>
<div class="not-found-actions">
<a class="btn primary" href="/"><i class="fa-solid fa-house"></i> Back to Home</a>
<a class="btn btn-outline" href="/pages/image-tools.html"><i class="fa-solid fa-toolbox"></i> Explore Tools</a>
</div>
</section>
</main>
<div id="footer-placeholder"></div>
<script defer src="/assets/js/utils.js"></script>
<script defer src="/assets/js/theme.js"></script>
<script defer src="/assets/js/navigation.js"></script>
<script defer src="/assets/js/search.js"></script>
<script defer src="/assets/js/toast.js"></script>
<script defer src="/assets/js/app.js"></script>
<script src="/assets/js/onetoolbox-common-layout.js"></script>
</body>
</html>
